name: AI Code Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

jobs:
  review-code:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute AI Review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openrouter/free
        run: |
          python run_review.py

      - name: Post Review Comment on Pull Request
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'output/code_review_report.md';
            if (fs.existsSync(reportPath)) {
              const report = fs.readFileSync(reportPath, 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: "## 🤖 AI Automated Code Review Findings\n\n" + report
              });
            } else {
              console.log("No report file found to comment.");
            }

      - name: Email Code Review Report
        if: always() && hashFiles('output/code_review_report.md') != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "AI Code Review Report - PR #${{ github.event.pull_request.number }}"
          to: ${{ secrets.MAIL_RECIPIENT }}
          from: "AI Code Reviewer <${{ secrets.MAIL_USERNAME }}>"
          body: "The AI Code Reviewer completed its check on Pull Request #${{ github.event.pull_request.number }}. Find the full report attached."
          attachments: output/code_review_report.md